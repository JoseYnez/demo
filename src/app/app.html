<header class="shell__bar" data-tauri-drag-region="deep">
  <img
    class="shell__logo"
    src="assets/icon.svg"
    alt="demo"
    width="18"
    height="18"
    [title]="identidadDelBuild"
  />

  <nav class="shell__nav">
    <a routerLink="/styleguide" routerLinkActive="is-active">Styleguide</a>
    <a routerLink="/tauri-demo" routerLinkActive="is-active">Tauri IPC</a>
    @if (!auth.authenticated()) {
      <a routerLink="/login" routerLinkActive="is-active">Acceso</a>
    }
  </nav>

  <div class="shell__actions">
    @if (auth.session(); as sesion) {
      <button
        class="shell__action shell__action--salir"
        type="button"
        (click)="auth.logout()"
        [attr.aria-label]="'Cerrar la sesión de ' + sesion.displayName"
        [title]="'Cerrar la sesión de ' + sesion.displayName"
      >
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path
            d="M10 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <path
            d="M14.5 8.5 18 12l-3.5 3.5M18 12H9.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    }

    <button
      class="shell__action"
      type="button"
      (click)="themes.toggle()"
      [attr.aria-label]="
        themes.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'
      "
    >
      @if (themes.theme() === "dark") {
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M12 2.4v2.4M12 19.2v2.4M4.4 12H2M22 12h-2.4M6.1 6.1 4.4 4.4M19.6 19.6l-1.7-1.7M17.9 6.1l1.7-1.7M4.4 19.6l1.7-1.7"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path
            d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
      }
    </button>

    <button
      class="shell__action shell__action--campana"
      type="button"
      (click)="abrirNotificaciones()"
      [attr.aria-label]="etiquetaNotificaciones()"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path
          d="M6.4 10a5.6 5.6 0 0 1 11.2 0c0 3.1.7 4.8 1.4 5.8a.6.6 0 0 1-.5 1H5.5a.6.6 0 0 1-.5-1c.7-1 1.4-2.7 1.4-5.8Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path
          d="M9.9 19.2a2.1 2.1 0 0 0 4.2 0"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>

      @if (pendientes() > 0) {
        <span class="shell__badge" aria-hidden="true">{{ contador() }}</span>
      }
    </button>

  </div>

  @if (enTauri) {
    <div class="shell__controls">
      <button
        class="shell__control"
        type="button"
        aria-label="Minimizar"
        (click)="minimizar()"
      >
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path d="M0 5h10" stroke="currentColor" stroke-width="1" />
        </svg>
      </button>

      <button
        class="shell__control"
        type="button"
        [attr.aria-label]="etiquetaDeExpansion()"
        (click)="alternarExpansion()"
      >
        @if (pantallaCompleta()) {
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
            <path
              d="M3.5 0.5V3.5H0.5M6.5 0.5V3.5H9.5M3.5 9.5V6.5H0.5M6.5 9.5V6.5H9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            />
          </svg>
        } @else if (maximizada()) {
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
            <path
              d="M2.5 2.5V0.5h7v7h-2M0.5 2.5h7v7h-7z"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
            <path
              d="M0.5 0.5h9v9h-9z"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            />
          </svg>
        }
      </button>

      <button
        class="shell__control shell__control--close"
        type="button"
        aria-label="Cerrar"
        (click)="cerrar()"
      >
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
          <path
            d="M0.5 0.5l9 9M9.5 0.5l-9 9"
            stroke="currentColor"
            stroke-width="1"
          />
        </svg>
      </button>
    </div>
  }
</header>

<main class="shell__content">
  <router-outlet />
</main>
