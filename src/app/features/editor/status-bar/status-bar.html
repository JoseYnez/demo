<footer class="status">
  <span
    class="status__ruta selectable"
    [title]="documento()?.ruta ?? ''"
  >{{ documento()?.ruta ?? "sin guardar" }}</span>

  @if (mensaje()) {
    <span class="status__mensaje">{{ mensaje() }}</span>
  }
  <span class="sr-only" role="status">{{ mensaje() }}</span>

  <span class="status__celda">Ln {{ cursor().line }}, Col {{ cursor().column }}</span>

  <select
    class="status__dialecto"
    aria-label="Dialecto SQL"
    (change)="alCambiarDialecto($event)"
  >
    @for (dialecto of dialectos; track dialecto.id) {
      <option
        [value]="dialecto.id"
        [selected]="dialecto.id === (documento()?.dialecto ?? 'tsql')"
      >{{ dialecto.etiqueta }}</option>
    }
  </select>

  <span class="status__celda">{{ eolEtiqueta() }}</span>
  <span class="status__celda">{{ codificacionEtiqueta() }}</span>
</footer>
