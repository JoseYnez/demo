<div class="ui-field">
  @if (label()) {
    <label class="ui-label" [attr.for]="id">
      {{ label() }}
      @if (required()) {
        <span class="ui-label__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="select">
    <select
      class="ui-control"
      [class.is-invalid]="!!error()"
      [id]="id"
      [attr.name]="name() || null"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-invalid]="!!error()"
      [value]="value()"
      (change)="value.set($any($event.target).value)"
      (blur)="touch.emit()"
    >
      @if (placeholder()) {
        <option value="" disabled>{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled ?? false">
          {{ option.label }}
        </option>
      }
    </select>
    <span class="select__caret" aria-hidden="true"></span>
  </div>

  @if (error()) {
    <p class="ui-msg ui-msg--error">{{ error() }}</p>
  } @else if (hint()) {
    <p class="ui-msg">{{ hint() }}</p>
  }
</div>
