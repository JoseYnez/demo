<app-field-shell
  [labelMode]="labelMode()"
  [label]="label()"
  [controlId]="id"
  [floated]="floated()"
  [required]="required()"
  [disabled]="disabled()"
  [hint]="hint()"
  [error]="error()"
>
  <div class="select">
    <select
      class="ui-control"
      [class.is-floating]="labelMode() === 'float'"
      [class.is-inset]="labelMode() === 'inset'"
      [class.is-invalid]="!!error()"
      [id]="id"
      [attr.name]="name() || null"
      [disabled]="disabled()"
      [required]="required()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="describedBy()"
      [value]="value()"
      (change)="value.set($any($event.target).value)"
      (blur)="touch.emit()"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="value() === ''">{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option
          [value]="option.value"
          [disabled]="option.disabled ?? false"
          [selected]="option.value === value()"
        >
          {{ option.label }}
        </option>
      }
    </select>
    <span class="select__divider" aria-hidden="true"></span>
    <span class="select__caret" aria-hidden="true"></span>
  </div>
</app-field-shell>
