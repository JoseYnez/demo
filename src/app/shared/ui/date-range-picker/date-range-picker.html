<app-field-shell
  [labelMode]="labelMode()"
  [label]="label()"
  [controlId]="id"
  [floated]="floated()"
  [required]="required()"
  [disabled]="disabled()"
  [hint]="hint()"
  [error]="error()"
>
  <div
    class="ui-anchor"
    (keydown)="capa.alPulsarTecla($event)"
    (focusout)="capa.alSalirElFoco($event)"
  >
    <button
      #disparador
      type="button"
      class="ui-control ui-trigger"
      [class.is-floating]="labelMode() === 'float'"
      [class.is-inset]="labelMode() === 'inset'"
      [class.is-invalid]="!!error()"
      [id]="id"
      [attr.name]="name() || null"
      [disabled]="bloqueado()"
      aria-haspopup="dialog"
      [attr.aria-expanded]="capa.abierto()"
      [attr.aria-readonly]="readonly() || null"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="describedBy()"
      (click)="alternar()"
    >
      <span class="ui-trigger__texto" [class.is-placeholder]="vacio()">
        {{ etiqueta() }}
      </span>
      <svg
        class="ui-trigger__icono"
        viewBox="0 0 24 24"
        width="16"
        height="16"
        aria-hidden="true"
      >
        <rect
          x="3.5"
          y="5"
          width="17"
          height="15"
          rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <path
          d="M3.5 9.5h17M8 3.5v3M16 3.5v3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    </button>

    @if (capa.abierto()) {
      <div
        #panel
        class="ui-panel"
        [class.is-arriba]="capa.arriba()"
        [class.is-derecha]="capa.aLaDerecha()"
        role="dialog"
        aria-label="Elegir un rango de fechas"
        tabindex="-1"
      >
        @if (opciones().length) {
          <div class="ui-panel__presets" role="group" aria-label="Rangos habituales">
            @for (opcion of opciones(); track opcion.preset.id) {
              <button
                type="button"
                class="ui-panel__preset"
                [disabled]="!opcion.disponible"
                [attr.aria-pressed]="esActivo(opcion.preset)"
                (click)="elegir(opcion)"
              >
                {{ opcion.preset.label }}
              </button>
            }
          </div>
        }

        <div class="ui-panel__custom">
          <div class="ui-panel__campos">
            <label class="ui-panel__campo">
              <span class="ui-panel__campo-label">Desde</span>
              <input
                #campoDesde
                type="date"
                class="ui-control ui-panel__control"
                [value]="desde()"
                [attr.min]="minDate() || null"
                [attr.max]="hasta() || maxDate() || null"
                (input)="desde.set(campoDesde.value)"
              />
            </label>

            <label class="ui-panel__campo">
              <span class="ui-panel__campo-label">Hasta</span>
              <input
                #campoHasta
                type="date"
                class="ui-control ui-panel__control"
                [value]="hasta()"
                [attr.min]="desde() || minDate() || null"
                [attr.max]="maxDate() || null"
                (input)="hasta.set(campoHasta.value)"
              />
            </label>
          </div>

          @if (aviso()) {
            <p class="ui-panel__aviso" role="alert">{{ aviso() }}</p>
          }

          <div class="ui-panel__acciones">
            <app-button variant="ghost" size="sm" (click)="limpiar()">
              Limpiar
            </app-button>
            <app-button variant="primary" size="sm" (click)="aplicar()">
              Aplicar
            </app-button>
          </div>
        </div>
      </div>
    }
  </div>
</app-field-shell>
