<div [class]="classes()" [style.--toast-ms]="duration() + 'ms'">
  <span class="toast__icon" aria-hidden="true">
    @switch (variant()) {
      @case ("success") {
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="m8.4 12.2 2.5 2.5 4.7-5.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      }
      @case ("warning") {
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M12 4.2 21 19.3H3Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <path
            d="M12 9.6v3.9"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <circle cx="12" cy="16.4" r="1" fill="currentColor" />
        </svg>
      }
      @case ("danger") {
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      }
      @case ("info") {
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M12 11.2v5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <circle cx="12" cy="8.1" r="1" fill="currentColor" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            d="M6.4 10a5.6 5.6 0 0 1 11.2 0c0 3.1.7 4.8 1.4 5.8a.6.6 0 0 1-.5 1H5.5a.6.6 0 0 1-.5-1c.7-1 1.4-2.7 1.4-5.8Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <path
            d="M9.9 19.2a2.1 2.1 0 0 0 4.2 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      }
    }
  </span>

  <div class="toast__body">
    <p class="toast__heading selectable">
      <span class="toast__familia">{{ familia() }}:</span>
      {{ heading() }}
    </p>
    @if (detail()) {
      <p class="toast__detail selectable">{{ detail() }}</p>
    }
  </div>

  <button
    class="toast__close"
    type="button"
    aria-label="Cerrar el aviso"
    (click)="closed.emit()"
  >
    <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
      <path
        d="m6 6 12 12M18 6 6 18"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
  </button>

  @if (cuentaAtras()) {
    <span class="toast__bar" aria-hidden="true"></span>
  }
</div>
