<app-field-shell
  [labelMode]="labelMode()"
  [label]="label()"
  [controlId]="id"
  [floated]="floated()"
  [required]="required()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [multiline]="true"
  [hint]="hint()"
  [error]="error()"
>
  <textarea
    class="ui-control"
    [class.is-floating]="labelMode() === 'float'"
    [class.is-inset]="labelMode() === 'inset'"
    [class.is-invalid]="!!error()"
    [id]="id"
    [rows]="rows()"
    [attr.name]="name() || null"
    [placeholder]="visiblePlaceholder()"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="describedBy()"
    [value]="value()"
    (input)="value.set($any($event.target).value)"
    (focus)="focused.set(true)"
    (blur)="onBlur()"
  ></textarea>
</app-field-shell>
