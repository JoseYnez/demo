<span [class]="classes()">
  @if (dot()) {
    <span class="badge__dot" aria-hidden="true"></span>
  }
  <span
    class="badge__text"
    [attr.title]="label() || null"
    [attr.aria-hidden]="label() ? true : null"
  ><ng-content /></span>
  @if (label()) {
    <span class="sr-only">{{ label() }}</span>
  }
</span>
