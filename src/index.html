<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tauri + Angular</title>
    <base href="/" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem("theme");
        if (theme === "dark" || theme === "light") {
          root.dataset["theme"] = theme;
        }
        var env = root.getAttribute("data-accent-hue");
        var stored = root.hasAttribute("data-accent-locked")
          ? null
          : localStorage.getItem("accent-hue");
        var raw = stored !== null ? stored : env;
        if (raw !== null && raw.trim() !== "" && isFinite(Number(raw))) {
          var hue = ((Math.round(Number(raw)) % 360) + 360) % 360;
          root.style.setProperty("--accent-hue", String(hue));
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
